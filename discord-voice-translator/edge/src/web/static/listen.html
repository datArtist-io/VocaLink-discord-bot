<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040d12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23071a20'/%3E%3Cpath d='M12 33h8l4.5-12 7 24 6.5-18 4 10 3.5-4H52' fill='none' stroke='%23ff8a3d' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Manrope:wght@400;600;700&family=Schibsted+Grotesk:wght@600&display=swap" rel="stylesheet">
<title>VocaLink · My translator</title>
<style>
:root{color-scheme:dark;--bg:#040d12;--panel:rgba(14,40,46,.55);--ink:#e6efe9;--muted:#9db4ae;--line:rgba(170,230,215,.14);--accent:#ff8a3d;--accent-ink:#1a0d04;--live:#7ff0dc;--soft:rgba(255,138,61,.12);--you:rgba(4,16,22,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% -10%,#0d3a40 0%,#071a20 42%,#040d12 100%) fixed;color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.brand{display:flex;align-items:center;gap:10px;margin:4px 0 18px;color:var(--ink);text-decoration:none;font:600 20px/1 "Schibsted Grotesk",Manrope,sans-serif;letter-spacing:-.03em}
.brand svg{width:30px;height:30px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.hide{display:none!important}

/* first run: pick your language */
#pick h1{font:300 32px/1.12 Fraunces,Georgia,serif;letter-spacing:-.015em;margin:20px 0 8px}
#pick p{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.lang{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font:inherit;color:inherit;cursor:pointer;text-align:left}
.lang:hover{border-color:var(--accent)}
.lang .f{font-size:22px}

/* live view */
header{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.live .dot{background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.me{margin-left:auto;cursor:pointer;background:var(--soft);border-color:transparent}
.people{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.person{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:58px;cursor:pointer;font-size:12px;color:var(--muted)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:18px;outline:3px solid transparent;outline-offset:2px;transition:outline-color .15s}
.person.talking .av{outline-color:var(--live)}
.person.muted{opacity:.4}
.feed{display:flex;flex-direction:column;gap:10px}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;animation:in .18s ease-out;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:2px}
.msg .who b{color:var(--ink);font-weight:600}
.msg .txt{font:300 21px/1.35 Fraunces,Georgia,serif}
.msg.partial .txt{color:var(--muted)}
.msg .orig{font-size:13px;color:var(--muted);margin-top:4px}
.msg.you{background:var(--you)}
.msg.you .txt{font:400 15px/1.45 Manrope,sans-serif;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:48px 12px}
.empty .big{font-size:40px}
.bar{position:sticky;bottom:0;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:12px}
.bar input{flex:1;accent-color:var(--accent)}
.self{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px;font-size:14px;cursor:pointer}.self span{color:var(--muted)}
.tip{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.start{position:fixed;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(6px)}
.start button{font:inherit;font-size:18px;font-weight:700;padding:16px 28px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 8px 30px color-mix(in srgb,var(--accent) 35%,transparent)}
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="https://vocalinktest.vercel.app" target="_blank" rel="noopener"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#071a20"/><rect x=".75" y=".75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#7ff0dc" stroke-opacity=".18" stroke-width="1.5"/><path d="M13 33h7l4.5-12 7 24 6.5-18 4 10 3.5-4H51" fill="none" stroke="#ff8a3d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>VocaLink</a>

  <section id="pick" class="hide">
    <h1>Which language do you want to hear?</h1>
    <p>Everyone else will be translated into it, just for you.</p>
    <div class="grid" id="langs"></div>
  </section>

  <section id="live" class="hide">
    <header>
      <span class="pill" id="state"><span class="dot"></span><span id="stateTxt">Connecting…</span></span>
      <span class="pill me" id="mylang" title="Change your language in Discord"></span>
    </header>
    <div class="people" id="people"></div>
    <div class="feed" id="feed">
      <div class="empty" id="empty">You’re all set. When someone speaks, you’ll hear them in your language.</div>
    </div>
    <div class="bar">🔈<input id="vol" type="range" min="0" max="200" value="100" aria-label="Volume">🔊</div>
    <label class="self"><input type="checkbox" id="self"> Hear myself too <span>(for testing on your own)</span></label>
    <div class="tip">Use headphones. You never hear yourself, and translations get quieter while you talk.</div>
  </section>

</div>
<div class="start hide" id="startOv"><button id="startBtn">Start listening</button></div>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const BUILD = '__BUILD_ID__';
  const token = q.get('t');
  const $ = (id) => document.getElementById(id);
  const FLAGS = { en:'🇺🇸', tl:'🇵🇭', es:'🇪🇸', fr:'🇫🇷', pt:'🇧🇷', de:'🇩🇪', it:'🇮🇹', ja:'🇯🇵', ko:'🇰🇷', zh:'🇨🇳', hi:'🇮🇳', id:'🇮🇩', ms:'🇲🇾', vi:'🇻🇳', ar:'🇸🇦', ru:'🇷🇺', tr:'🇹🇷', pl:'🇵🇱', nl:'🇳🇱', sv:'🇸🇪', uk:'🇺🇦', ro:'🇷🇴', el:'🇬🇷', cs:'🇨🇿', ta:'🇮🇳', da:'🇩🇰', fi:'🇫🇮', no:'🇳🇴', hu:'🇭🇺', bg:'🇧🇬', hr:'🇭🇷', sk:'🇸🇰' };
  const TOP = ['en','tl','es','fr','pt','de','ja','ko','zh','hi','id','vi','ar','ru','it','tr'];
  const flag = (l) => FLAGS[l] || '🌐';
  let names = { en:'English', tl:'Filipino', es:'Spanish', fr:'French', pt:'Portuguese', de:'German', it:'Italian', ja:'Japanese', ko:'Korean', zh:'Chinese', hi:'Hindi', id:'Indonesian', ms:'Malay', vi:'Vietnamese', ar:'Arabic', ru:'Russian', tr:'Turkish', pl:'Polish', nl:'Dutch', sv:'Swedish', uk:'Ukrainian', ro:'Romanian', el:'Greek', cs:'Czech', ta:'Tamil' };
  const langName = (l) => l === 'tl' ? 'Filipino' : (names[l] || l.toUpperCase());

  let lang = q.get('lang') || (q.get('pick') ? '' : (localStorage.getItem('vl_lang') || ''));
  let ws = null, ctx = null, master = null, duck = null;
  // On plans without AI voices the bot sends text only, and this device reads it aloud.
  let voiceMode = 'ai', youTalking = false;
  const spokenKeys = new Set();
  function deviceSpeak(text) {
    if (!('speechSynthesis' in window) || !text) return;
    const base = (lang || '').split('-')[0];
    const want = base === 'tl' ? ['fil', 'tl'] : [base];
    const vs = speechSynthesis.getVoices().filter(v => want.some(w => v.lang.toLowerCase().replace('_', '-').startsWith(w)));
    const score = (v) => (/natural|neural|online|premium|enhanced/i.test(v.name) ? 2 : 0) + (/google/i.test(v.name) ? 1 : 0);
    vs.sort((a, b) => score(b) - score(a));
    if (speechSynthesis.pending) speechSynthesis.cancel(); // never fall behind the conversation
    const u = new SpeechSynthesisUtterance(text);
    if (vs[0]) { u.voice = vs[0]; u.lang = vs[0].lang; } else u.lang = lang;
    u.volume = Math.max(0, Math.min(1, (+$('vol').value || 100) / 100 * (youTalking ? 0.3 : 1)));
    u.rate = 1.05;
    speechSynthesis.speak(u);
  }
  let playhead = 0;
  let fails = 0;
  let updatePending = false;
  const dubs = new Map();            // dub id -> { user, arrived, skip, started }
  const people = new Map();          // user id -> { name, el }
  const muted = new Set();
  const STALE_S = 3;                 // a translation that would start >3 s late is skipped: stay real-time

  // ---------------------------------------------------------------- language picker
  async function loadNames() {
    try {
      const r = await fetch('/api/languages?t=' + encodeURIComponent(token));
      if (r.ok) for (const [c, v] of Object.entries((await r.json()).languages || {})) names[c] = names[c] || v.name;
    } catch {}
  }
  function showPicker() {
    const codes = [...new Set([...TOP, ...Object.keys(names)])].filter((c) => names[c] || TOP.includes(c));
    $('langs').innerHTML = '';
    for (const c of codes) {
      const b = document.createElement('button'); b.className = 'lang';
      b.innerHTML = `<span class="f">${flag(c)}</span><span>${langName(c)}</span>`;
      b.onclick = () => choose(c);
      $('langs').appendChild(b);
    }
    $('live').classList.add('hide'); $('pick').classList.remove('hide');
  }
  async function choose(c) {
    lang = c; try { localStorage.setItem('vl_lang', c); } catch {}
    $('pick').classList.add('hide');
    await startAudio();               // the tap that picked a language also unlocks audio
    showLive();
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'set_lang', lang }));
    else connect();
  }

  // ---------------------------------------------------------------- live view
  function showLive() {
    $('mylang').textContent = `${flag(lang)} ${langName(lang)}`;
    $('live').classList.remove('hide');
    if (!ctx || ctx.state !== 'running') $('startOv').classList.remove('hide');
  }
  function state(txt, live) { $('stateTxt').textContent = txt; $('state').classList.toggle('live', !!live); }
  // the language is chosen in Discord (dropdown); the player follows it live
  $('self').onchange = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'hear_self', on: $('self').checked })); };

  const COLORS = ['#5865f2','#eb459e','#23a55a','#f0b232','#e67e22','#00a8fc','#9b59b6','#1abc9c'];
  function person(id, name) {
    let p = people.get(id);
    if (p) { if (name && p.name !== name) { p.name = name; p.el.querySelector('span').textContent = name; } return p; }
    const el = document.createElement('div'); el.className = 'person';
    const col = COLORS[[...id].reduce((a, ch) => a + ch.charCodeAt(0), 0) % COLORS.length];
    el.innerHTML = `<div class="av" style="background:${col}">${(name || '?').trim()[0]?.toUpperCase() || '?'}</div><span></span>`;
    el.querySelector('span').textContent = name || '…';
    el.title = 'Tap to mute / unmute their translation';
    el.onclick = () => { muted.has(id) ? muted.delete(id) : muted.add(id); el.classList.toggle('muted', muted.has(id)); };
    $('people').appendChild(el);
    p = { name, el }; people.set(id, p); return p;
  }

  function caption(m) {
    if (m.you) return;                // your own words aren't news to you
    person(m.user_id, m.name);
    $('empty')?.remove();
    let el = document.getElementById('c-' + m.key);
    if (!el) { el = document.createElement('div'); el.id = 'c-' + m.key; $('feed').prepend(el); }
    el.className = 'msg' + (m.final ? '' : ' partial');
    const same = m.src === lang;
    const txt = same ? m.original : (m.text || (m.final ? m.original : '…'));
    el.innerHTML = '<div class="who"><b></b><span></span></div><div class="txt"></div>';
    el.querySelector('b').textContent = m.name;
    el.querySelector('.who span').textContent = same ? '' : `${flag(m.src)} → ${flag(lang)}`;
    el.querySelector('.txt').textContent = txt;
    if (!same && m.final && m.text) { const o = document.createElement('div'); o.className = 'orig'; o.textContent = m.original; el.appendChild(o); }
    const feed = $('feed'); while (feed.children.length > 80) feed.lastElementChild.remove();
    if (voiceMode === 'device' && m.final && !same && m.text && !spokenKeys.has(m.key)) {
      spokenKeys.add(m.key); if (spokenKeys.size > 300) spokenKeys.delete(spokenKeys.values().next().value);
      deviceSpeak(m.text);
    }
  }

  // ---------------------------------------------------------------- audio
  async function startAudio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      duck = ctx.createGain(); master = ctx.createGain();
      duck.connect(master); master.connect(ctx.destination);
      master.gain.value = Number($('vol').value) / 100;
    }
    await ctx.resume();
    $('startOv').classList.add('hide');
    if (updatePending) { location.reload(); return; }   // apply a pending update on this tap
    ctx.onstatechange = () => { if (ctx.state !== 'running') $('startOv').classList.remove('hide'); };
    try { await navigator.wakeLock?.request('screen'); } catch {}
  }
  $('startBtn').onclick = startAudio;
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible') return;
    try { await navigator.wakeLock?.request('screen'); } catch {}       // browsers drop it when hidden
    if (ctx && ctx.state !== 'running') { try { await ctx.resume(); } catch {} if (ctx.state !== 'running') $('startOv').classList.remove('hide'); }
  });
  $('vol').oninput = () => { if (master) master.gain.setTargetAtTime($('vol').value / 100, ctx.currentTime, 0.05); };

  // Translations play ONE AT A TIME, in the order they started. Each is buffered briefly
  // (~150 ms) and then played as one continuous, gap-free stream with soft edges. Two people
  // talking close together are queued, never chopped into each other.
  const SR = 48000, PREBUFFER_S = 0.15, FADE_S = 0.006;
  const FIRST_AUDIO_S = 10;   // a translation may wait this long for its first audio (busy voice service)
  const NO_DATA_S = 3;        // once playing, this much silence from the server means it's finished
  const MAX_WAIT_S = 8;       // a translation that couldn't start within 8 s of being spoken is skipped
  const queue = [];                  // dub ids, in start order
  function fresh(id, user, rate) {
    const now = performance.now();
    return { id, user, rate: rate || SR, chunks: [], buffered: 0, started: false, ended: false, skip: false, first: true, lastData: now, arrived: now };
  }
  function dubFor(id) {
    let d = dubs.get(id);
    if (!d) { d = fresh(id, null, SR); dubs.set(id, d); queue.push(id); }
    return d;
  }
  function schedule(d, f, last) {
    const now = ctx.currentTime;
    if (playhead < now + 0.02) playhead = now + 0.05;      // underrun: tiny re-buffer instead of a hard cut
    if (d.first) { for (let i = 0, n = Math.min(f.length, FADE_S * d.rate); i < n; i++) f[i] *= i / n; d.first = false; }
    if (last) { const n = Math.min(f.length, FADE_S * d.rate); for (let i = 0; i < n; i++) f[f.length - 1 - i] *= i / n; }
    const b = ctx.createBuffer(1, f.length, d.rate); b.copyToChannel(f, 0);
    const s = ctx.createBufferSource(); s.buffer = b; s.connect(duck);
    s.start(playhead); playhead += b.duration;
  }
  function takeAll(d) {
    const total = d.chunks.reduce((n, x) => n + x.length, 0); const f = new Float32Array(total); let o = 0;
    for (const x of d.chunks) { f.set(x, o); o += x.length; }
    d.chunks = []; return f;
  }
  function finish(d) {
    queue.shift();
    const id = d.id;
    setTimeout(() => { if (dubs.get(id) === d) dubs.delete(id); }, 10000);
  }
  // play whatever the head of the queue can play now; move on when it's done
  function pump() {
    if (!ctx || ctx.state !== 'running') return;
    while (queue.length) {
      const d = dubs.get(queue[0]);
      if (!d) { queue.shift(); continue; }
      if (d.skip || muted.has(d.user)) { d.skip = true; finish(d); continue; }
      const idle = (performance.now() - d.lastData) / 1000;
      if (!d.started) {
        const waitLimit = d.chunks.length ? NO_DATA_S : FIRST_AUDIO_S;
        if (d.buffered < PREBUFFER_S && !d.ended && idle < waitLimit) return;   // still buffering
        if (!d.chunks.length) { finish(d); continue; }                         // ended / gave up with nothing
        // queued behind someone else: it still plays, unless it would start very late (stay live)
        const startsIn = Math.max(0, playhead - ctx.currentTime);
        if ((performance.now() - d.arrived) / 1000 + startsIn > MAX_WAIT_S) { d.skip = true; finish(d); continue; }
        if (playhead < ctx.currentTime + 0.03) playhead = ctx.currentTime + 0.03;
        d.started = true;
        schedule(d, takeAll(d), d.ended);
      } else if (d.chunks.length) {
        schedule(d, takeAll(d), d.ended);
      }
      if (d.ended || idle >= NO_DATA_S) { finish(d); continue; }                // done: next translation
      return;                                                                    // head still streaming
    }
  }
  setInterval(pump, 100);
  function onAudio(buf) {
    if (!ctx || ctx.state !== 'running') return;   // not listening yet: don't pile audio up
    const dv = new DataView(buf); const d = dubFor(dv.getUint32(0));
    if (d.skip) return;
    const pcm = new Int16Array(buf, 8); const f = new Float32Array(pcm.length);
    for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 32768;
    d.chunks.push(f); d.buffered += f.length / d.rate; d.lastData = performance.now();
    pump();
  }
  function startDub(m) {
    if (!ctx || ctx.state !== 'running') return;
    // always a fresh entry: ids can repeat after a reconnect
    const old = dubs.get(m.dub_id);
    if (old) { const i = queue.indexOf(m.dub_id); if (i >= 0) queue.splice(i, 1); }
    dubs.set(m.dub_id, fresh(m.dub_id, m.user_id, m.sample_rate));
    queue.push(m.dub_id);
  }
  function endDub(id) {
    const d = dubs.get(id); if (!d) return;
    d.ended = true; pump();
  }
  function resetPlayback() {
    dubs.clear(); queue.length = 0;
    if (duck && ctx) duck.gain.setTargetAtTime(1, ctx.currentTime, 0.05);
    for (const p of people.values()) p.el.classList.remove('talking');
  }

  function speaking(m) {
    if (m.you) {
      // you're talking: others' translations step back so they never talk over you
      youTalking = !!m.on;
      if (duck) duck.gain.setTargetAtTime(m.on ? 0.3 : 1, ctx.currentTime, m.on ? 0.04 : 0.25);
      return;
    }
    const p = people.get(m.user_id); if (p) p.el.classList.toggle('talking', !!m.on);
  }

  // ---------------------------------------------------------------- connection
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/listen?t=${encodeURIComponent(token)}&lang=${encodeURIComponent(lang)}&v=3`);
    ws.binaryType = 'arraybuffer';
    let opened = false;
    ws.onopen = () => { opened = true; fails = 0; resetPlayback(); state('Connecting…'); if ($('self').checked) ws.send(JSON.stringify({ type: 'hear_self', on: true })); };
    ws.onclose = async () => {
      if (!opened && ++fails >= 2) {
        // couldn't connect twice: is the link still valid?
        try {
          const r = await fetch('/api/languages?t=' + encodeURIComponent(token));
          if (r.status === 401) { state('This link has expired. In Discord, tap “Open my translator” again.'); return; }
        } catch {}
      }
      state('Reconnecting…'); setTimeout(connect, Math.min(1500 * fails || 1500, 8000));
    };
    ws.onmessage = (ev) => typeof ev.data === 'string' ? onJson(JSON.parse(ev.data)) : onAudio(ev.data);
  }
  function onJson(m) {
    if (m.type === 'build') {
      // VocaLink was updated. Reloading would need a new tap to restart audio, so never do it
      // while you're listening: reload only if audio hasn't started yet (or on your next tap).
      if (m.id !== BUILD) { if (!ctx || ctx.state !== 'running') location.reload(); else updatePending = true; }
      return;
    }
    if (m.type === 'status') {
      if (m.voice) voiceMode = m.voice;
      state(m.live ? 'Live' : 'Waiting for the call to start…', m.live);
      if (m.lang && m.lang !== lang) {
        lang = m.lang; try { localStorage.setItem('vl_lang', lang); } catch {}
        $('mylang').textContent = `${flag(lang)} ${langName(lang)}`;
        const u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u);  // a reload keeps it
        resetPlayback();
      }
      if (!m.live) resetPlayback();
    }
    else if (m.type === 'caption') caption(m);
    else if (m.type === 'dub_start') startDub(m);
    else if (m.type === 'dub_end') endDub(m.dub_id);
    else if (m.type === 'speaking') speaking(m);
    else if (m.type === 'volume') {
      $('vol').value = m.value; if (master) master.gain.setTargetAtTime(m.value / 100, ctx.currentTime, 0.05);
      const u = new URL(location.href); u.searchParams.set('vol', m.value); history.replaceState(null, '', u);
    }
  }

  if (q.get('vol')) $('vol').value = q.get('vol');
  // ---------------------------------------------------------------- go
  if (!token) { document.body.innerHTML = '<div class="wrap"><p class="empty">Open your translator from Discord: tap <b>🎧 Open my translator</b>.</p></div>'; return; }
  loadNames().then(() => { if (lang) { showLive(); connect(); } else showPicker(); });
})();
</script>
</body>
</html>
